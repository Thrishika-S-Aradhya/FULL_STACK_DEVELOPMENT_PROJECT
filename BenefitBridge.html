home:'Home|ಮುಖಪುಟ|होम|முகப்பு|హోమ్|ഹോം|मुख्यपृष्ठ|হোম',

logout:'Logout|ಲಾಗ್ ಔಟ್|लॉगआउट|வெளியேறு|లాగౌట్|ലോഗ് ഔട്ട്|लॉगआउट|লগআউট',
hero:'Find the government benefits you deserve|ನೀವು ಅರ್ಹರಾದ ಸರ್ಕಾರಿ ಲಾಭಗಳನ್ನು ಕಂಡುಕೊಳ್ಳಿ|अपने हक़ के सरकारी लाभ खोजें|உங்களுக்குத் தகுதியான அரசுப் பயன்களைக் கண்டறியுங்கள்|మీకు అర్హమైన ప్రభుత్వ ప్రయోజనాలను కనుగొనండి|നിങ്ങൾക്ക് അർഹമായ സർക്കാർ ആനുകൂല്യങ്ങൾ കണ്ടെത്തുക|तुम्हाला पात्र असलेले सरकारी लाभ शोधा|আপনার প্রাপ্য সরকারি সুবিধা খুঁজে নিন',
tag:'Bridging the gap between the benefits people deserve and the support they actually receive.|ಜನರು ಅರ್ಹವಾದ ಲಾಭಗಳು ಮತ್ತು ಅವರಿಗೆ ನಿಜವಾಗಿ ಸಿಗುವ ಬೆಂಬಲದ ನಡುವಿನ ಅಂತರವನ್ನು ಕಡಿಮೆ ಮಾಡುವುದು.|लोगों के हक़ के लाभ और उन्हें वास्तव में मिलने वाली सहायता के बीच की दूरी मिटाना।|மக்களுக்குத் தகுதியான பயன்களுக்கும் அவர்கள் உண்மையில் பெறும் ஆதரவுக்கும் இடையிலான இடைவெளியை நிரப்புதல்.|ప్రజలకు అర్హమైన ప్రయోజనాలకు, వారికి అందే మద్దతుకు మధ్య ఉన్న అంతరాన్ని తగ్గించడం.|ജനങ്ങൾക്ക് അർഹമായ ആനുകൂല്യങ്ങളും അവർക്ക് ലഭിക്കുന്ന പിന്തുണയും തമ്മിലുള്ള വിടവ് നികത്തുന്നു.|लोकांना पात्र असलेले लाभ आणि प्रत्यक्ष मिळणारी मदत यांतील तफावत भरून काढणे.|মানুষের প্রাপ্য সুবিধা ও তাদের প্রকৃত প্রাপ্ত সহায়তার মধ্যে ব্যবধান ঘোচানো।',
find:'Find Benefits for Me|ನನಗಾಗಿ ಲಾಭಗಳನ್ನು ಹುಡುಕಿ|मेरे लिए लाभ खोजें|எனக்கான பயன்களைக் கண்டறி|నా కోసం ప్రయోజనాలు కనుగొనండి|എനിക്കുള്ള ആനുകൂല്യങ്ങൾ കണ്ടെത്തുക|माझ्यासाठी लाभ शोधा|আমার জন্য সুবিধা খুঁজুন',
explore:'Explore Schemes|ಯೋಜನೆಗಳನ್ನು ನೋಡಿ|योजनाएं देखें|திட்டங்களைப் பார்|పథకాలను చూడండి|പദ്ധതികൾ കാണുക|योजना पहा|প্রকল্প দেখুন',
popular:'Popular Schemes|ಜನಪ್ರಿಯ ಯೋಜನೆಗಳು|लोकप्रिय योजनाएं|பிரபல திட்டங்கள்|ప్రసిద్ధ పథకాలు|ജനപ്രിയ പദ്ധതികൾ|लोकप्रिय योजना|জনপ্রিয় প্রকল্প',
cats:'Categories|ವರ್ಗಗಳು|श्रेणियां|வகைகள்|వర్గాలు|വിഭാഗങ്ങൾ|प्रवर्ग|বিভাগ',
how:'How it works|ಇದು ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ|यह कैसे काम करता है|இது எப்படி வேலை செய்கிறது|ఇది ఎలా పనిచేస్తుంది|ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു|हे कसे कार्य करते|এটি কীভাবে কাজ করে',
h1:'Tell us about you|ನಿಮ್ಮ ಬಗ್ಗೆ ತಿಳಿಸಿ|अपने बारे में बताएं|உங்களைப் பற்றி சொல்லுங்கள்|మీ గురించి చెప్పండి|നിങ്ങളെക്കുറിച്ച് പറയുക|तुमच्याबद्दल सांगा|আপনার সম্পর্কে বলুন',
h2:'See matching schemes|ಹೊಂದುವ ಯೋಜನೆಗಳನ್ನು ನೋಡಿ|उपयुक्त योजनाएं देखें|பொருந்தும் திட்டங்களைப் பார்|సరిపోయే పథకాలు చూడండి|അനുയോജ്യമായ പദ്ധതികൾ കാണുക|जुळणाऱ्या योजना पहा|মানানসই প্রকল্প দেখুন',
h3:'Prepare documents and track|ದಾಖಲೆ ಸಿದ್ಧಪಡಿಸಿ, ಟ್ರ್ಯಾಕ್ ಮಾಡಿ|दस्तावेज़ तैयार करें और ट्रैक करें|ஆவணங்களைத் தயாரித்து கண்காணி|పత్రాలు సిద్ధం చేసి ట్రాక్ చేయండి|രേഖകൾ ഒരുക്കി ട്രാക്ക് ചെയ്യുക|कागदपत्रे तयार करा व ट्रॅक करा|নথি প্রস্তুত করে ট্র্যাক করুন',
whyt:'Why BenefitBridge?|ಏಕೆ BenefitBridge?|BenefitBridge क्यों?|ஏன் BenefitBridge?|ఎందుకు BenefitBridge?|എന്തുകൊണ്ട് BenefitBridge?|BenefitBridge का?|কেন BenefitBridge?',
why:'Free, simple and in your language. We never promise approval — we help you find schemes, prepare documents and follow up.|ಉಚಿತ, ಸರಳ, ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ. ನಾವು ಅನುಮೋದನೆಯ ಭರವಸೆ ನೀಡುವುದಿಲ್ಲ — ಯೋಜನೆ ಹುಡುಕಲು, ದಾಖಲೆ ಸಿದ್ಧಪಡಿಸಲು ಮತ್ತು ಅನುಸರಿಸಲು ಸಹಾಯ ಮಾಡುತ್ತೇವೆ.|मुफ़्त, सरल और आपकी भाषा में। हम स्वीकृति का वादा नहीं करते — योजना खोजने, दस्तावेज़ तैयार करने और अनुवर्ती कार्रवाई में मदद करते हैं।|இலவசம், எளிமை, உங்கள் மொழியில். ஒப்புதலுக்கு உறுதி அளிப்பதில்லை — திட்டங்களைக் கண்டறிய, ஆவணங்களைத் தயாரிக்க, பின்தொடர உதவுகிறோம்.|ఉచితం, సులభం, మీ భాషలో. ఆమోదానికి హామీ ఇవ్వం — పథకాలు కనుగొనడం, పత్రాలు సిద్ధం చేయడం, ఫాలో-అప్‌కు సహాయం చేస్తాం.|സൗജന്യം, ലളിതം, നിങ്ങളുടെ ഭാഷയിൽ. അംഗീകാരം ഉറപ്പ് നൽകുന്നില്ല — പദ്ധതികൾ കണ്ടെത്താനും രേഖകൾ ഒരുക്കാനും തുടർനടപടിക്കും സഹായിക്കുന്നു.|मोफत, सोपे, तुमच्या भाषेत. आम्ही मंजुरीची हमी देत नाही — योजना शोधणे, कागदपत्रे तयार करणे आणि पाठपुरावा यात मदत करतो.|বিনামূল্যে, সহজ, আপনার ভাষায়। অনুমোদনের নিশ্চয়তা দিই না — প্রকল্প খুঁজতে, নথি প্রস্তুত করতে ও ফলো-আপে সাহায্য করি।',

q1:'Is this an official government website?|ಇದು ಅಧಿಕೃತ ಸರ್ಕಾರಿ ವೆಬ್‌ಸೈಟ್ ಆಗಿದೆಯೇ?|क्या यह आधिकारिक सरकारी वेबसाइट है?|இது அதிகாரப்பூர்வ அரசு இணையதளமா?|ఇది అధికారిక ప్రభుత్వ వెబ్‌సైట్‌నా?|ഇത് ഔദ്യോഗിക സർക്കാർ വെബ്സൈറ്റാണോ?|ही अधिकृत सरकारी वेबसाइट आहे का?|এটি কি সরকারি ওয়েবসাইট?',
a1:'No. BenefitBridge is an independent guide. Always apply on the official website linked on each scheme.|ಇಲ್ಲ. BenefitBridge ಸ್ವತಂತ್ರ ಮಾರ್ಗದರ್ಶಿ. ಪ್ರತಿ ಯೋಜನೆಯಲ್ಲಿರುವ ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲೇ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ.|नहीं। BenefitBridge एक स्वतंत्र मार्गदर्शक है। हर योजना पर दिए आधिकारिक वेबसाइट पर ही आवेदन करें।|இல்லை. BenefitBridge ஒரு சுயாதீன வழிகாட்டி. ஒவ்வொரு திட்டத்திலும் உள்ள அதிகாரப்பூர்வ இணையதளத்தில் மட்டுமே விண்ணப்பிக்கவும்.|కాదు. BenefitBridge స్వతంత్ర మార్గదర్శి. ప్రతి పథకంలో ఇచ్చిన అధికారిక వెబ్‌సైట్‌లోనే దరఖాస్తు చేయండి.|അല്ല. BenefitBridge ഒരു സ്വതന്ത്ര വഴികാട്ടിയാണ്. ഓരോ പദ്ധതിയിലും നൽകിയ ഔദ്യോഗിക വെബ്സൈറ്റിൽ തന്നെ അപേക്ഷിക്കുക.|नाही. BenefitBridge हे स्वतंत्र मार्गदर्शक आहे. प्रत्येक योजनेतील अधिकृत संकेतस्थळावरच अर्ज करा.|না। BenefitBridge একটি স্বাধীন গাইড। প্রতিটি প্রকল্পে দেওয়া অফিসিয়াল ওয়েবসাইটেই আবেদন করুন।',
q2:'Is my data safe?|ನನ್ನ ಮಾಹಿತಿ ಸುರಕ್ಷಿತವೇ?|क्या मेरा डेटा सुरक्षित है?|என் தரவு பாதுகாப்பானதா?|నా డేటా సురక్షితమేనా?|എന്റെ ഡാറ്റ സുരക്ഷിതമാണോ?|माझा डेटा सुरक्षित आहे का?|আমার তথ্য কি নিরাপদ?',
a2:'In this demo, your data stays only in this browser on your device. We never ask for Aadhaar numbers.|ಈ ಡೆಮೊದಲ್ಲಿ ನಿಮ್ಮ ಮಾಹಿತಿ ನಿಮ್ಮ ಸಾಧನದ ಈ ಬ್ರೌಸರ್‌ನಲ್ಲೇ ಇರುತ್ತದೆ. ಆಧಾರ್ ಸಂಖ್ಯೆ ಕೇಳುವುದಿಲ್ಲ.|इस डेमो में आपका डेटा सिर्फ़ आपके डिवाइस के इसी ब्राउज़र में रहता है। हम आधार नंबर नहीं मांगते।|இந்த டெமோவில் உங்கள் தரவு உங்கள் சாதனத்தின் இந்த உலாவியில் மட்டுமே இருக்கும். ஆதார் எண் கேட்பதில்லை.|ఈ డెమోలో మీ డేటా మీ పరికరంలోని ఈ బ్రౌజర్‌లోనే ఉంటుంది. ఆధార్ నంబర్ అడగము.|ഈ ഡെമോയിൽ നിങ്ങളുടെ ഡാറ്റ നിങ്ങളുടെ ഉപകരണത്തിലെ ഈ ബ്രൗസറിൽ മാത്രം. ആധാർ നമ്പർ ചോദിക്കില്ല.|या डेमोमध्ये तुमचा डेटा फक्त तुमच्या उपकरणातील याच ब्राउझरमध्ये राहतो. आधार क्रमांक मागत नाही.|এই ডেমোতে আপনার তথ্য শুধু আপনার ডিভাইসের এই ব্রাউজারেই থাকে। আধার নম্বর চাই না।',

disc:'Results are indicative only and do not guarantee eligibility or approval. Final decisions are made by the relevant government authorities. Rules here are simplified demo summaries — always confirm on the official website.|ಫಲಿತಾಂಶಗಳು ಸೂಚನಾತ್ಮಕ ಮಾತ್ರ; ಅರ್ಹತೆ ಅಥವಾ ಅನುಮೋದನೆಗೆ ಖಾತರಿ ಇಲ್ಲ. ಅಂತಿಮ ನಿರ್ಧಾರವನ್ನು ಸಂಬಂಧಿತ ಸರ್ಕಾರಿ ಪ್ರಾಧಿಕಾರಗಳು ತೆಗೆದುಕೊಳ್ಳುತ್ತವೆ. ಇಲ್ಲಿನ ನಿಯಮಗಳು ಸರಳೀಕೃತ ಡೆಮೊ ಸಾರಾಂಶಗಳು; ಅಧಿಕೃತ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.|परिणाम केवल संकेत हैं और पात्रता या स्वीकृति की गारंटी नहीं हैं। अंतिम निर्णय संबंधित सरकारी प्राधिकरण लेते हैं। यहां के नियम सरल डेमो सारांश हैं — आधिकारिक वेबसाइट पर पुष्टि करें।|முடிவுகள் வழிகாட்டுதலுக்கு மட்டுமே; தகுதி அல்லது ஒப்புதலுக்கு உத்தரவாதம் இல்லை. இறுதி முடிவை அந்தந்த அரசு அதிகாரிகள் எடுப்பார்கள். இங்குள்ள விதிகள் எளிமையான டெமோ சுருக்கங்கள்; அதிகாரப்பூர்வ இணையதளத்தில் உறுதிசெய்யவும்.|ఫలితాలు సూచనలు మాత్రమే; అర్హత లేదా ఆమోదానికి హామీ కాదు. తుది నిర్ణయం సంబంధిత ప్రభుత్వ అధికారులదే. ఇక్కడి నిబంధనలు సరళీకృత డెమో సారాంశాలు — అధికారిక వెబ్‌సైట్‌లో నిర్ధారించుకోండి.|ഫലങ്ങൾ സൂചന മാത്രമാണ്; യോഗ്യതയ്ക്കോ അംഗീകാരത്തിനോ ഉറപ്പില്ല. അന്തിമ തീരുമാനം ബന്ധപ്പെട്ട സർക്കാർ അധികാരികളുടേതാണ്. ഇവിടത്തെ നിബന്ധനകൾ ലഘൂകരിച്ച ഡെമോ സംഗ്രഹങ്ങളാണ് — ഔദ്യോഗിക വെബ്സൈറ്റിൽ ഉറപ്പാക്കുക.|निकाल केवळ सूचक आहेत; पात्रता किंवा मंजुरीची हमी नाही. अंतिम निर्णय संबंधित सरकारी प्राधिकरण घेते. येथील नियम सोपे डेमो सारांश आहेत — अधिकृत संकेतस्थळावर खात्री करा.|ফলাফল শুধু ইঙ্গিতমূলক; যোগ্যতা বা অনুমোদনের নিশ্চয়তা নয়। চূড়ান্ত সিদ্ধান্ত সংশ্লিষ্ট সরকারি কর্তৃপক্ষ নেয়। এখানকার নিয়ম সরল ডেমো সারাংশ — অফিসিয়াল ওয়েবসাইটে নিশ্চিত করুন।',
enn:'Scheme details are shown in English, as in the original sources.|ಯೋಜನೆಯ ವಿವರಗಳು ಮೂಲ ಮೂಲಗಳಂತೆ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿವೆ.|योजना का विवरण मूल स्रोतों की तरह अंग्रेज़ी में है।|திட்ட விவரங்கள் மூலத்தைப் போல ஆங்கிலத்தில் உள்ளன.|పథక వివరాలు మూలాల వలె ఇంగ్లీషులో ఉన్నాయి.|പദ്ധതി വിവരങ്ങൾ യഥാർത്ഥ ഉറവിടങ്ങളിലെപ്പോലെ ഇംഗ്ലീഷിലാണ്.|योजनेचा तपशील मूळ स्रोतांप्रमाणे इंग्रजीत आहे.|প্রকল্পের বিবরণ মূল উৎসের মতো ইংরেজিতে।',

V.schemes=()=>{const rc=cu().recent.map(i=>S().find(s=>s.id==i)).filter(Boolean);return`<div class=w><h1>${t('schemes')}</h1><div class=row><input style="flex:1;min-width:200px" id=q type=search placeholder="${t('search')}" value="${esc(filt.q)}" oninput="filt.q=this.value;lst()"><label><input type=checkbox ${filt.r?'checked':''} onchange="filt.r=this.checked;lst()"> ${t('elig')}</label>${cmp.length>1?`<button class=b onclick="modal={t:'c'};rmod()">${t('cmp')} (${cmp.length})</button>`:''}</div><div class=chips><button class="ch ${filt.c=='all'?'on':''}" onclick="fc('all')">${t('all')}</button>${CATS.map(c=>`<button class="ch ${filt.c==c?'on':''}" onclick="fc('${c}')">${IC[c]} ${t(c)}</button>`).join('')}</div><div id=lst class=g></div>${rc.length?`<h2>${t('recent')}</h2><div class=chips>${rc.map(s=>`<button class=ch onclick="openS('${s.id}')">${esc(s.n)}</button>`).join('')}</div>`:''}<p class=sm>${t('disc')}</p></div>`};
const RK={elig:0,more:1,not:2};
function lst(){const u=cu(),hp=hasP(),q=filt.q.toLowerCase();let a=S().filter(s=>(filt.c=='all'||s.c==filt.c)&&(!q||(s.n+s.d+s.b+s.dp+t(s.c)+(s.a||'')).toLowerCase().includes(q))).map(s=>({s,e:ev(s,u.p)}));if(filt.r)a=a.filter(x=>x.e.r=='elig');if(hp)a.sort((x,y)=>RK[x.e.r]-RK[y.e.r]);const l=$('lst');if(l)l.innerHTML=a.map(x=>card(x.s,x.e,hp)).join('')||`<p>${t('none')}</p>`}
function fc(c){filt.c=c;if(route=='schemes')render()}
V.check=()=>{const u=cu();let r='';if(chk&&hasP()){const a=S().map(s=>({s,e:ev(s,u.p)}));r=['elig','more','not'].map(k=>{const g=a.filter(x=>x.e.r==k);return`<h2>${badge(k)} (${g.length})</h2>`+g.map(x=>`<div class=card><b>${esc(x.s.n)}</b><ul class=sm>${x.e.w.map(w=>`<li>${rs(w,1)}</li>`).join('')}</ul><button class=g2 onclick="openS('${x.s.id}')">${t('view')}</button></div>`).join('')}).join('')+`<p class=sm>${t('disc')}</p>`}return`<div class=w><h1>${t('check')}</h1>${form(1)}${r}</div>`};
V.gap=()=>{const u=cu();if(!hasP())return`<div class=w><h1>${t('gap')}</h1><div class=card><p>${t('need')}</p><a class=b href="#check">${t('check')}</a></div></div>`;
const a=S().map(s=>({s,e:ev(s,u.p)})),ne=a.filter(x=>x.e.r=='elig'&&!u.apps[x.s.id]),mo=a.filter(x=>x.e.r=='more'),mf=[...new Set(mo.flatMap(x=>x.e.w.filter(w=>w[3]=='?').map(w=>w[0])))],tr=Object.keys(u.apps).map(i=>S().find(s=>s.id==i)).filter(Boolean),md=tr.map(s=>({s,m:dl(s).filter(d=>d.m&&!(u.docs[s.id]||{})[d.k])})).filter(x=>x.m.length);
return`<div class=w><h1>${t('gap')}</h1><div class="card" style="border-color:var(--tl)"><h2>${t('gapmsg').replace('{n}',ne.length)}</h2></div><div class=g>${ne.map(x=>card(x.s,x.e,1)).join('')}</div>${mf.length?`<h2>${t('badge')||''}${badge('more')}</h2><p>${t('need')} <b>${mf.map(f=>t(f)).join(', ')}</b></p>`:''}${md.length?`<h2>${t('missing')}</h2>${md.map(x=>`<div class=card><b>${esc(x.s.n)}</b><br>${x.m.map(d=>esc(d.n)).join(', ')}</div>`).join('')}`:''}<h2>${t('next')}</h2><ul>${mf.length?`<li><a href="#profile">${t('profile')}</a></li>`:''}${ne.length?`<li><a href="#schemes">${t('explore')} (${ne.length})</a></li>`:''}<li><a href="#track">${t('track')}</a></li></ul><p class=sm>${t('disc')}</p></div>`};
V.track=()=>{const u=cu(),ids=Object.keys(u.apps).map(i=>S().find(s=>s.id==i)).filter(Boolean),td=today(),due=ids.filter(s=>{const a=u.apps[s.id];return a.fu&&a.fu<=td&&a.st<5});
return`<div class=w><h1>${t('track')}</h1>${due.length?`<div class="card wn"><b>🔔 ${t('rem')}</b>${due.map(s=>`<br>${esc(s.n)} — ${u.apps[s.id].fu}`).join('')}</div>`:''}${ids.map(s=>{const a=u.apps[s.id],r=rdy(s);return`<div class=card><h3>${esc(s.n)}</h3><div class=pb><i style="width:${r.p}%"></i></div><p class=sm>${r.a}/${r.b} — ${r.p}% ${t('ready')}</p><div class=fm><label>${t('status')}<select onchange="up('${s.id}','st',+this.value)">${[0,1,2,3,4,5,6].map(i=>`<option value=${i} ${a.st==i?'selected':''}>${t('st'+i)}</option>`).join('')}</select></label><label>${t('ref')}<input value="${esc(a.ref)}" onchange="up('${s.id}','ref',this.value)"></label><label>${t('fup')}<input type=date value="${a.fu}" onchange="up('${s.id}','fu',this.value)"></label></div><label class=fm style="margin-top:10px"><span>${t('notes')}</span><textarea rows=2 onchange="up('${s.id}','notes',this.value)">${esc(a.notes)}</textarea></label><p class=sm><b>${t('hist')}:</b> ${a.h.map(([d,i])=>`${d} — ${t('st'+i)}`).join(' → ')}</p><div class=row style="justify-content:flex-start"><button class=g2 onclick="openS('${s.id}')">${t('view')}</button><button class=g2 onclick="ra('${s.id}')">${t('rmv')}</button></div></div>`}).join('')||`<p>${t('none')}</p>`}</div>`};
V.profile=()=>{const u=DB.sess?DB.users[DB.sess]:null;return`<div class=w><h1>${t('profile')}</h1>${u?`<p><b>${esc(u.name)}</b> · ${esc(DB.sess)}</p>`:`<p><a class=b href="#auth">${t('login')}</a></p>`}${form(0)}</div>`};
V.auth=()=>`<div class=w><h1>${t('login')}</h1><div class=chips><button class="ch ${am=='in'?'on':''}" onclick="am='in';render()">${t('sin')}</button><button class="ch ${am=='reg'?'on':''}" onclick="am='reg';render()">${t('reg')}</button></div><form class="card fm" onsubmit="return au(event)">${am=='reg'?`<label>${t('name')}<input id=an required></label>`:''}<label>${t('email')}<input id=ae type=email required></label><label>${t('pw')}<input id=ap type=password minlength=6 required></label><button class=b>${t(am=='reg'?'reg':'sin')}</button><p id=err class=er></p></form></div>`;
async function au(e){e.preventDefault();const em=$('ae').value.trim().toLowerCase(),pw=await h($('ap').value),er=$('err');if(am=='reg'){if(DB.users[em]){er.textContent=t('bad');return false}const g=DB.guest;DB.users[em]={name:$('an').value.trim()||em,pw,p:g.p,apps:g.apps,docs:g.docs,recent:g.recent};DB.guest=bl()}else if(!DB.users[em]||DB.users[em].pw!=pw){er.textContent=t('bad');return false}DB.sess=em;save();location.hash='profile';render();return false}
V.admin=()=>{if(!adm)return`<div class=w><h1>${t('admin')}</h1><form class=card onsubmit="return al(event)"><label>Passcode<input id=pc type=password></label><br><button class=b>${t('sin')}</button><p id=err class=er></p><p class=sm>Demo passcode: admin123 — change it after login. A real deployment needs server-side authentication.</p></form></div>`;
return`<div class=w><h1>${t('admin')}</h1><div class=card><h3>Add scheme</h3><form class=fm onsubmit="return as(event)"><label>Name<input id=sn required></label><label>Category<select id=sc>${CATS.map(c=>`<option value=${c}>${t(c)}</option>`).join('')}</select></label><label>Department<input id=sd required></label><label>Official URL (https://)<input id=su type=url required></label><label>Description<input id=sx required></label><label>Benefits<input id=sb required></label><label>Min age<input id=smin type=number></label><label>Max age<input id=smax type=number></label><label>Max income (₹)<input id=sinc type=number></label><label>Gender<select id=sg><option value="">Any</option><option value=female>Female</option><option value=male>Male</option></select></label><label>Occupation<select id=so><option value="">Any</option>${O.occ.map(o=>`<option>${o}</option>`).join('')}</select></label><label>Documents (comma separated, all required)<input id=sdc></label><label>Steps (separate with |)<input id=sst></label><button class=b>Add</button></form></div><div class=card><h3>Custom schemes (${DB.custom.length})</h3>${DB.custom.map(s=>`<div class=row><span>${esc(s.n)}</span><button class=g2 onclick="ds('${s.id}')">Delete</button></div>`).join('')||'—'}</div><div class=card><h3>Feedback (${DB.fb.length})</h3>${DB.fb.map(f=>`<p class=sm>${f.t.slice(0,10)} · ${esc(f.u)} · ${esc(f.s||'general')}<br>${esc(f.m)}</p>`).join('')||'—'}${DB.fb.length?`<button class=g2 onclick="DB.fb=[];save();render()">Clear</button>`:''}</div><div class=card><h3>Passcode</h3><input id=np type=password placeholder="New passcode"><br><br><button class=g2 onclick="cpw()">Change</button></div></div>`};
async function al(e){e.preventDefault();if(!DB.adm){DB.adm=await h('admin123');save()}if(await h($('pc').value)==DB.adm){adm=true;render()}else $('err').textContent=t('bad');return false}
async function cpw(){const v=$('np').value;if(v.length<6)return toast('6+ characters');DB.adm=await h(v);save();toast('OK')}
function as(e){e.preventDefault();const v=i=>$(i).value.trim(),cd=[];if(v('smin'))cd.push(['age','>=',+v('smin')]);if(v('smax'))cd.push(['age','<=',+v('smax')]);if(v('sinc'))cd.push(['income','<=',+v('sinc')]);if(v('sg'))cd.push(['gender','=',v('sg')]);if(v('so'))cd.push(['occ','=',v('so')]);DB.custom.push({id:'c'+Date.now(),c:v('sc'),n:v('sn'),dp:v('sd'),u:v('su'),d:v('sx'),b:v('sb'),cd,dc:v('sdc').split(',').map(x=>x.trim().replace(/[:,]/g,'')).filter(Boolean).map(x=>x+':1').join(','),st:v('sst')||AP,a:''});save();render();toast('Added');return false}
function ds(i){DB.custom=DB.custom.filter(s=>s.id!=i);save();render()}
function smod(s){const u=cu(),hp=hasP(),e=ev(s,u.p),r=rdy(s),ap=u.apps[s.id];return`<div class=ov onclick="if(event.target==this)cm()"><div class=mb role=dialog aria-modal=true><button class=x onclick="cm()" aria-label="Close">✕</button><h2>${esc(s.n)}</h2><p class=sm>${t('enn')}</p><p>${esc(s.d)}</p><h3>${t('ben')}</h3><p>${esc(s.b)}</p><h3>${t('elreq')} ${hp?badge(e.r):''}</h3><ul>${e.w.map(w=>`<li>${rs(w,hp)}</li>`).join('')}</ul><p class=sm>${t('disc')}</p><h3>${t('docs')}</h3><div class=pb><i style="width:${r.p}%"></i></div><p><b>${r.a}/${r.b} — ${r.p}% ${t('ready')}</b></p>${dl(s).map(d=>`<label class=dr><input type=checkbox ${(u.docs[s.id]||{})[d.k]?'checked':''} onchange="dc('${s.id}','${d.k}',this.checked)"><span>${esc(d.n)} <em>(${t(d.m?'mand':'opt')})</em><br><small class=sm>${esc(d.w)}</small></span></label>`).join('')}<h3>${t('steps')}</h3><ol>${s.st.split('|').map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p>${t('dept')}: ${esc(s.dp)}<br><a href="${esc(s.u)}" target=_blank rel="noopener noreferrer">${t('site')} ↗</a></p><div class=row style="justify-content:flex-start"><button class=b onclick="ap('${s.id}')" ${ap?'disabled':''}>${t(ap?'saved':'save')}</button><button class=g2 onclick="modal={t:'f',id:'${s.id}'};rmod()">${t('fb')}</button></div></div></div>`}
function cmod(){const a=cmp.map(i=>S().find(s=>s.id==i)).filter(Boolean);const row=(l,f)=>`<tr><th>${l}</th>${a.map(s=>`<td>${f(s)}</td>`).join('')}</tr>`;return`<div class=ov onclick="if(event.target==this)cm()"><div class=mb><button class=x onclick="cm()" aria-label="Close">✕</button><h2>${t('cmp')}</h2><div class=tb><table><tr><th></th>${a.map(s=>`<th>${esc(s.n)}</th>`).join('')}</tr>${row(t('dept'),s=>esc(s.dp))}${row(t('ben'),s=>esc(s.b))}${row(t('elreq'),s=>s.cd.map(w=>rs(w.concat(''),0)).join('<br>'))}${row(t('docs'),s=>dl(s).map(d=>esc(d.n)).join('<br>'))}${row(t('site'),s=>`<a href="${esc(s.u)}" target=_blank rel="noopener noreferrer">↗</a>`)}</table></div></div></div>`}
function fmod(){return`<div class=ov onclick="if(event.target==this)cm()"><div class=mb><button class=x onclick="cm()" aria-label="Close">✕</button><h2>${t('fb')}</h2><textarea id=fbt rows=5></textarea><br><br><button class=b onclick="fs()">${t('send')}</button></div></div>`}
function rmod(){$('mod').innerHTML=modal?modal.t=='s'?smod(S().find(s=>s.id==modal.id)):modal.t=='c'?cmod():fmod():'';document.body.style.overflow=modal?'hidden':''}
function openS(id){const r=cu().recent;cu().recent=[id,...r.filter(x=>x!=id)].slice(0,5);save();modal={t:'s',id};rmod()}
function cm(){modal=null;rmod();if(route=='schemes')lst()}
function tc(i){cmp=cmp.includes(i)?cmp.filter(x=>x!=i):[...cmp,i].slice(-3);render()}
function fs(){const m=$('fbt').value.trim();if(!m)return;DB.fb.push({t:new Date().toISOString(),u:DB.sess||'guest',s:modal.id||'',m});save();cm();toast(t('saved'))}
function ap(id){const u=cu();if(!u.apps[id])u.apps[id]={st:0,notes:'',ref:'',fu:'',h:[[today(),0]]};save();rmod();toast(t('saved'));if(route=='gap')render()}
function ra(id){delete cu().apps[id];save();render()}
function up(id,f,v){const a=cu().apps[id];if(f=='st'&&a.st!=v)a.h.push([today(),v]);a[f]=v;save();if(f=='st'||f=='fu')render()}
function dc(id,k,v){const u=cu();(u.docs[id]=u.docs[id]||{})[k]=v;save();const y=document.querySelector('.mb')?.scrollTop;rmod();const b=document.querySelector('.mb');if(b)b.scrollTop=y;if(route=='track'||route=='gap')render()}
function out(){DB.sess=null;save();location.hash='home';render()}
function setL(v){lang=v;LI=L.indexOf(v);DB.lang=v;save();render();rmod()}
function foot(){return`<footer><div class=w><p class=sm>${t('disc')}</p><a href="https://www.google.com/maps/search/Common+Service+Centre+near+me" target=_blank rel="noopener noreferrer">📍 ${t('near')}</a> · <a href="#" onclick="modal={t:'f',id:''};rmod();return false">${t('fb')}</a> · <a href="#admin">${t('admin')}</a></div></footer>`}
function nav(){const u=DB.sess?DB.users[DB.sess]:null;return`<header><div class="w nv"><a class=lg href="#home">🌉 BenefitBridge</a><nav>${['home','schemes','check','gap','track','profile'].map(r=>`<a href="#${r}" ${route==r?'class=on':''}>${t(r)}</a>`).join('')}</nav><select aria-label="Language" onchange="setL(this.value)">${L.map((l,i)=>`<option value=${l} ${l==lang?'selected':''}>${NM[i]}</option>`).join('')}</select>${u?`<button class=g2 onclick="out()">${esc(u.name)} · ${t('logout')}</button>`:`<a class=bt href="#auth">${t('login')}</a>`}</div></header>`}
function botH(){return`<button class="b fab" onclick="bo=!bo;render()">💬 Bridge Assistant</button>${bo?`<div class=bp><b>Bridge Assistant</b><div id=ms><div class="m b">${t('bhi')}</div>${chat.map(m=>`<div class="m ${m.r}">${m.h}</div>`).join('')}</div><form onsubmit="return ab(event)"><input id=bi autocomplete=off aria-label="Message"><button class=b>${t('send')}</button></form></div>`:''}`}
const KW={student:'edu',scholar:'edu',farm:'agri',kisan:'agri',health:'health',hospital:'health',house:'housing',home:'housing',electric:'housing',women:'women',woman:'women',senior:'senior',old:'senior',pension:'senior',job:'emp',unemploy:'emp',skill:'emp',food:'food',ration:'food',disab:'disab'};
function bot(q){q=q.toLowerCase();const all=S(),u=cu();const s=all.find(x=>(x.a+' '+x.n.toLowerCase()).split(' ').some(w=>w.length>3&&q.includes(w)&&!['scheme','yojana','pension'].includes(w)));
if(s){const ln=`<a href="${esc(s.u)}" target=_blank rel="noopener noreferrer">${esc(s.u)}</a>`;if(/doc|paper|certificate/.test(q))return`<b>${esc(s.n)}</b> — ${t('docs')}:<br>${dl(s).map(d=>`• ${esc(d.n)} (${t(d.m?'mand':'opt')}) — ${esc(d.w)}`).join('<br>')}`;if(/eligib|qualif|who/.test(q)){const e=ev(s,u.p);return`<b>${esc(s.n)}</b> ${hasP()?badge(e.r):''}<br>${e.w.map(w=>'• '+rs(w,hasP())).join('<br>')}<br><small>${t('disc')}</small>`}if(/apply|how|step/.test(q))return`<b>${esc(s.n)}</b><br>${s.st.split('|').map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>')}<br>${ln}`;return`<b>${esc(s.n)}</b> (${esc(s.dp)})<br>${esc(s.d)} ${esc(s.b)}<br>${ln}<br><a href="#" onclick="openS('${s.id}');return false">${t('view')}</a>`}
const g=Object.keys(GL).find(k=>q.includes(k));if(g)return esc(GL[g]);
const k=Object.keys(KW).find(k=>q.includes(k));if(k){const l=all.filter(x=>x.c==KW[k]);return l.map(x=>`• <a href="#" onclick="openS('${x.id}');return false">${esc(x.n)}</a>${hasP()?' '+badge(ev(x,u.p).r):''}`).join('<br>')}
return t('bno')}
function ab(e){e.preventDefault();const v=$('bi').value.trim();if(!v)return false;chat.push({r:'u',h:esc(v)},{r:'b',h:bot(v)});$('bi').value='';const m=$('ms');m.innerHTML=`<div class="m b">${t('bhi')}</div>`+chat.map(x=>`<div class="m ${x.r}">${x.h}</div>`).join('');m.scrollTop=m.scrollHeight;return false}
function render(){document.documentElement.lang=lang;$('app').innerHTML=nav()+'<main>'+(V[route]||V.home)()+'</main>'+foot()+botH();lst()}
window.onhashchange=()=>{route=location.hash.slice(1)||'home';if(route!='check')chk=0;render();scrollTo(0,0)};
route=location.hash.slice(1)||'home';render();
</script></body></html>
